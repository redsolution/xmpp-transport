[backend:max]
log_file = logs/xabber_transport_max.log
component_jid = max.example.com
server_ip = 127.0.0.1
server_port = 5237
component_connect_timeout = 20
component_reconnect_delay = 5
component_password = replace-with-max-component-secret
control_localpart = bot
server_domain = example.com
http_host = 127.0.0.1
http_port = 8089
qr_storage_dir = data/login_qr/max
qr_base_url = http://127.0.0.1:8089
qr_max_age_seconds = 3600
qr_cleanup_interval_seconds = 3600
contacts_page_size = 20
roster_group = MAX
test_self_messages = false

[database]
dsn = postgresql://transport:change-me@127.0.0.1:5432/xabber_transport
min_pool_size = 1
max_pool_size = 5
command_timeout = 30

[security]
credential_key = replace-with-a-fernet-key
iq_auth_secret = replace-with-shared-roster-iq-secret
